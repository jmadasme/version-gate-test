<path d="M396 370 V174 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="174" r="3" fill="#2A9D8F"/><rect x="428" y="153" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="171" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">CubeCell-LoRaWAN-Demo</text><text x="444" y="186" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Demo autónomo de LoRaWAN para verificar placa, gateway y credenciales.</text><text x="1104" y="178" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">01</text><path d="M396 370 V223 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="223" r="3" fill="#2A9D8F"/><rect x="428" y="202" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="220" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">CubeCell-LoRaWAN-Node</text><text x="444" y="235" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Nodo base HTCC-AB01 con payload HEX hacia un gateway Milesight UG56.</text><text x="1104" y="227" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">02</text><path d="M396 370 V272 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="272" r="3" fill="#2A9D8F"/><rect x="428" y="251" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="269" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">CubeCell-LoRaWAN-Node-v1.1</text><text x="444" y="284" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Clase A con RadioLib 7.7.1: join, envío y control explícito del radio.</text><text x="1104" y="276" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">03</text><path d="M396 370 V321 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="321" r="3" fill="#2A9D8F"/><rect x="428" y="300" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="318" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">CubeCell-LoRaWAN-Node-v1.2</text><text x="444" y="333" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Estabilidad de join y reintentos para redes con cobertura irregular.</text><text x="1104" y="325" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">04</text><path d="M396 370 V370 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="370" r="3" fill="#2A9D8F"/><rect x="428" y="349" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="367" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">CubeCell-LoRaWAN-Node-v1.3</text><text x="444" y="382" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Puente bidireccional serial↔LoRaWAN: HEX hacia arriba y downlinks como texto.</text><text x="1104" y="374" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">05</text><path d="M396 370 V419 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="419" r="3" fill="#2A9D8F"/><rect x="428" y="398" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="416" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">Cubecell-htcc-ab01-2</text><text x="444" y="431" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Nodo mínimo de sensores sobre HTCC-AB01, sin capas innecesarias.</text><text x="1104" y="423" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">06</text><path d="M396 370 V468 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="468" r="3" fill="#2A9D8F"/><rect x="428" y="447" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="465" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">cubecell-dht11-lora</text><text x="444" y="480" fill="#9db4bd" font-family="sans-serif" font-size="9.5">DHT11 con deep sleep de 10 minutos, OTAA US915 SF7 y foco en batería.</text><text x="1104" y="472" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">07</text><path d="M396 370 V517 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="517" r="3" fill="#2A9D8F"/><rect x="428" y="496" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="514" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">HTCC_AB02A_LoRaWAN</text><text x="444" y="529" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Firmware v3.0 para HTCC-AB02A como nodo de sensores LoRaWAN.</text><text x="1104" y="521" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">08</text><path d="M396 370 V566 H428" fill="none" stroke="#2A9D8F" stroke-opacity=".34" stroke-width="1.2"/><circle cx="396" cy="566" r="3" fill="#2A9D8F"/><rect x="428" y="545" width="690" height="42" rx="9" fill="#0b222b" stroke="rgba(148, 190, 200, .16)"/><text x="444" y="563" fill="#e6f0f3" font-family="monospace" font-size="12.5" font-weight="600">HTCC_AB02A_DS18B20</text><text x="444" y="578" fill="#9db4bd" font-family="sans-serif" font-size="9.5">Variante v1.2 con DS18B20 para temperatura de precisión por 1-Wire.</text><text x="1104" y="570" text-anchor="end" fill="#5B7C99" font-family="monospace" font-size="9">09</text>
<text x="58" y="735" fill="#9db4bd" font-family="monospace" font-size="10">Cada nodo es una carpeta real en versions/. No se borraron etapas: se pusieron en contexto.</text>
